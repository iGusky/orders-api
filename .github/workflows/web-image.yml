# Construye la imagen linux/arm64 de la Web, la publica en GHCR y avisa a Dokploy para redesplegar.
# Solo corre al llegar cambios a main (merge de un PR desde dev). Ver docs/despliegue.md.
name: web-image

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.dockerignore'
      - '.github/workflows/web-image.yml'
  workflow_dispatch:

concurrency:
  group: web-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/orders-api-web

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    # Runner ARM nativo: compila sin emulación. Si no está disponible para el repo, usa ubuntu-latest
    # y agrega docker/setup-qemu-action antes de setup-buildx-action.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de imagen en minúsculas
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          # Vite incrusta estas variables al compilar. Se definen en Settings → Secrets and variables → Actions → Variables.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Redesplegar en Dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_WEB }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DOKPLOY_DEPLOY_WEBHOOK_WEB no está definido; redespliega manualmente en Dokploy."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
