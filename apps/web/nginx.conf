server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # El HTTPS lo termina Traefik (Dokploy); aquí solo se sirven archivos estáticos.
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Encabezados de seguridad. `always` para que también salgan en 404.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Permite que la ventana emergente de Google Identity Services le responda a la página.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  # Misma política que el dev server (vite.config.mts), en modo Report-Only hasta validarla en producción.
  add_header Content-Security-Policy-Report-Only "script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://apibazar.gushm.dev https://accounts.google.com/gsi/" always;

  # Archivos con hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # index.html nunca se cachea, para que un despliegue nuevo se vea de inmediato.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy-Report-Only "script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://apibazar.gushm.dev https://accounts.google.com/gsi/" always;
  }

  # Rutas de react-router (/inventario, /movimientos...): todo lo que no es archivo va a index.html.
  location / {
    try_files $uri /index.html;
  }
}
