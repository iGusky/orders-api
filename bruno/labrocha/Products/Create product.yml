info:
  name: Create product
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_URL}}/products"
  body:
    type: json
    data: |-
      {
        "name": "Sticker",
        "description": "",
        "stock": 50,
        "price": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
