info:
  name: Create product
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_URL}}/products"
  body:
    type: json
    data: |-
      {
        "name": "Pines G",
        "description": "",
        "priceCents": 3500
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
