info:
  name: Create product
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_URL}}/products"
  body:
    type: json
    data: |-
      {
        "name": "Totebag",
        "description": "Hechas de manta con grabados. Diferentes diseños.",
        "priceCents": 25000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
