info:
  name: Auth google
  type: http
  seq: 4

http:
  method: POST
  url: "{{API_URL}}/auth/google"
  body:
    type: json
    data: |-
      {
          "credential": "{{GOOGLE_ID_TOKEN}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
